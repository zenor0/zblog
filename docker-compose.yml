services:
  zblog:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
    image: zblog:latest
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      ZBLOG_STATE_DIR: /app/.data
      DATABASE_URL: file:/app/.data/zblog.db
      ZBLOG_PDF_PREVIEW_COMMAND: pdftocairo
      ZBLOG_PDF_RENDER_CONCURRENCY: '4'
    ports:
      - '127.0.0.1:3000:3000'
    volumes:
      - zblog-data:/app/.data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'node -e "fetch(''http://127.0.0.1:3000/admin'').then((response) => process.exit(response.status < 500 ? 0 : 1)).catch(() => process.exit(1))"',
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  zblog-data:
